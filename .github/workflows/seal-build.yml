name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.8.0"
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: source-map-js-tgz
          path: source-map-js-1.2.1.tgz
          if-no-files-found: error
